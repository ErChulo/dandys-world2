<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffe8f5" />
  <title>Dandy's Coloring Carousel</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="fixes.css" />
  <link rel="stylesheet" href="enhancements.css" />
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="pickerScreen" class="screen picker-screen">
      <div class="picker-card" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
        <p class="eyebrow">Pick a friend ✨</p>
        <h1 id="pickerTitle">Dandy's Coloring Carousel</h1>
        <p class="subtitle">Choose a character, watch them dance, then color your own page.</p>
        <div class="stage-wrap"><div class="dance-stage"><div id="danceCharacter" class="character-sprite"></div></div></div>
        <div class="carousel-shell">
          <button id="prevBtn" class="round-btn" type="button" aria-label="Previous character">‹</button>
          <div id="carousel" class="carousel" tabindex="0" aria-label="Character carousel"></div>
          <button id="nextBtn" class="round-btn" type="button" aria-label="Next character">›</button>
        </div>
        <div class="selected-row"><span>Selected:</span><strong id="selectedName">Astro</strong></div>
        <button id="colorBtn" class="primary-btn" type="button">Color it! 🎨</button>
      </div>
    </section>

    <section id="colorScreen" class="screen color-screen hidden" aria-label="Coloring page">
      <header class="topbar">
        <button id="backBtn" class="soft-btn" type="button">← Characters</button>
        <div class="page-title-wrap"><h2 id="pageTitle">Astro</h2><span id="pageNumber">Page 1</span></div>
        <div class="top-actions"><button id="newPageBtn" class="soft-btn" type="button">New page ✨</button><button id="saveBtn" class="soft-btn" type="button">Save</button><button id="printBtn" class="soft-btn" type="button">Print</button></div>
      </header>
      <div class="workspace">
        <aside class="palette-panel" aria-label="Color palette">
          <div id="palette" class="palette"></div>
          <div class="music-controls"><button id="musicToggle" class="music-toggle" type="button" aria-pressed="false">♪ Music</button><label class="volume-control" for="musicVolume"><span>Vol.</span><input id="musicVolume" type="range" min="0" max="1" step="0.05" value="0.22" aria-label="Music volume"></label></div>
          <label class="brush-control">Brush<input id="brushSize" type="range" min="8" max="52" value="28" /></label>
          <button id="eraserBtn" class="tool-chip" type="button">Eraser</button><button id="clearBtn" class="tool-chip" type="button">Clear</button>
        </aside>
        <div id="canvasShell" class="canvas-shell"><canvas id="paintCanvas"></canvas><canvas id="lineCanvas"></canvas></div>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="app.js"></script>
  <script src="coloring-fix.js"></script>
  <script src="music-smooth.js"></script>
  <script src="enhancements.js"></script>
</body>
</html>
